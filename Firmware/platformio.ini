; Adjusted for this repo's flat layout: source files sit directly in this
; folder (unlike the internal tree this was extracted from, which nested
; them under New-firmware/).
;
; One env per ISM region. Each env sets FLATSAT_REGION_<band>, which
; regions.h turns into the uplink/downlink center frequencies (MHz) used
; by ruplink.h and rdownlink.h. To pin a non-preset frequency, add
; -DFLATSAT_UPLINK_FREQ_MHZ=<n> / -DFLATSAT_DOWNLINK_FREQ_MHZ=<n> to
; build_flags -- those override the region preset.
;
; Build one env with e.g. `pio run -e pico_tinyusb_eu868`. The default
; (`pio run` with no -e) builds the first env below, pico_tinyusb_us915,
; which preserves the historical 918/916 MHz values.
[platformio]
src_dir = .
default_envs = pico_tinyusb_us915

[radio_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    makuna/NeoPixelBus @ ^2.8.0
    sparkfun/SparkFun LIS2DH12 Arduino Library @ ^1.0.3
    adafruit/Adafruit BME280 Library @ ^2.2.4

[env:pico_tinyusb_us915]
extends = radio_base
build_flags = -DUSE_TINYUSB -DFLATSAT_REGION_US915

[env:pico_tinyusb_eu868]
extends = radio_base
build_flags = -DUSE_TINYUSB -DFLATSAT_REGION_EU868

[env:pico_tinyusb_eu433]
extends = radio_base
build_flags = -DUSE_TINYUSB -DFLATSAT_REGION_EU433

[env:pico_tinyusb_as923]
extends = radio_base
build_flags = -DUSE_TINYUSB -DFLATSAT_REGION_AS923
